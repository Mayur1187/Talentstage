{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/marketplace.css') }}">{% endblock %}
{% block content %}
<div class="dashboard-layout">
  {% include 'partials/sidebar.html' %}
  <main class="dashboard-main">
    <h1>Milestones & Payments</h1>
    <p class="text-muted">Sandbox milestone payments — release when deliverables are approved.</p>
    <a href="/client/active-projects" class="btn btn-sm btn-ghost mt-2">← Back to Active Projects</a>
    <div id="milestones-list" class="mt-2"></div>
  </main>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script>
function renderMilestones() {
  const state = TalentStageStore.get();
  // Filter for current contract if contract_id is provided, else show all
  const contractIdStr = "{{ contract_id|default('') }}";
  let displayMilestones = state.milestones || [];
  if (contractIdStr) {
      displayMilestones = displayMilestones.filter(m => m.contractId === Number(contractIdStr));
  }
  
  if (displayMilestones.length === 0) {
      document.getElementById("milestones-list").innerHTML = "<p class='text-muted'>No milestones found.</p>";
      return;
  }

  document.getElementById("milestones-list").innerHTML = displayMilestones.map(m => `
    <div class="milestone-item glass-card">
      <span class="milestone-status ${m.status}">${m.status}</span>
      <div>
        <strong>${m.name}</strong>
        <p class="text-sm text-muted">$${m.amount.toLocaleString()} (Gross)</p>
      </div>
      ${m.status === 'approved' ? `<button class="btn btn-sm btn-primary" onclick="releasePayment(${m.id})">Release Payment</button>` : ''}
      ${m.status === 'pending' ? `<button class="btn btn-sm btn-secondary" onclick="approveMilestone(${m.id})">Approve</button>` : ''}
    </div>`).join("");
}

function approveMilestone(id) {
  const state = TalentStageStore.get();
  const milestone = state.milestones.find(m => m.id === id);
  if (milestone) {
    milestone.status = "approved";
    TalentStageStore.save(state);
    showToast("Approved for release");
    renderMilestones();
  }
}

function releasePayment(id) {
  const state = TalentStageStore.get();
  const milestone = state.milestones.find(m => m.id === id);
  if (milestone) {
    milestone.status = "paid";
    
    // Calculate 10% commission
    const commission = milestone.amount * 0.10;
    const netEarnings = milestone.amount - commission;
    
    // Update earnings
    state.earnings.commission += commission;
    state.earnings.total += netEarnings;
    
    // Simulate pending decreasing if it was tracked there
    if (state.earnings.pending >= milestone.amount) {
        state.earnings.pending -= milestone.amount;
    }
    
    // Log transaction
    if (!state.transactions) state.transactions = [];
    state.transactions.unshift({
        date: new Date().toISOString().slice(0, 10),
        desc: "Milestone: " + milestone.name,
        gross: milestone.amount,
        commission: commission,
        net: netEarnings
    });

    TalentStageStore.save(state);
    showToast("Payment released (sandbox)");
    renderMilestones();
  }
}

document.addEventListener("DOMContentLoaded", () => {
  renderMilestones();
});
</script>
{% endblock %}
