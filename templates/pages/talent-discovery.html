{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/ai-panels.css') }}">{% endblock %}
{% block content %}
<div class="dashboard-layout">
  {% include 'partials/sidebar.html' %}
  <main class="dashboard-main">
    <h1>Smart Freelancer Match</h1>
    <p class="text-muted">AI ranks top 5 freelancers by skills, portfolio, rating & budget fit.</p>
    <div class="ai-panel" data-ai-panel="match">
      <div class="form-group"><label>Project skills needed</label><input id="match-skills" value="Figma, React"></div>
      <div class="grid grid-2 mt-2">
        <div class="form-group"><label>Budget min ($)</label><input id="match-budget-min" type="number" value="2000" placeholder="Min"></div>
        <div class="form-group"><label>Budget max ($)</label><input id="match-budget-max" type="number" value="5000" placeholder="Max"></div>
      </div>
      <button class="btn btn-primary mt-2" onclick="runAI('match', {skills: document.getElementById('match-skills').value, budgetMin: Number(document.getElementById('match-budget-min').value), budgetMax: Number(document.getElementById('match-budget-max').value)})">Find Matches</button>
      <div class="ai-loading hidden"><div class="loader"></div></div>
      <div class="ai-result hidden mt-2"></div>
    </div>
  </main>
</div>
{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>{% endblock %}
