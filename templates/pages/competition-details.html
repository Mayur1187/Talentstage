{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/competitions.css') }}">{% endblock %}
{% block content %}
<section class="section container">
  <div class="challenge-hero glass-card" id="challenge-hero"></div>
  <h2 class="mt-3">Leaderboard</h2>
  <ul class="leaderboard glass-card" id="leaderboard"></ul>
  <button class="btn btn-primary mt-3" onclick="submitEntry({{ challenge_id }})">Submit Entry</button>
</section>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script>
function renderChallenge() {
  const state = TalentStageStore.get();
  const ch = (state.challenges || []).find(c => c.id === {{ challenge_id }}) || MOCK_DATA.challenges[0];
  document.getElementById("challenge-hero").innerHTML = `<h1>${ch.title}</h1><p class="challenge-prize">${ch.prize}</p><p id="entries-count">${ch.entries} entries · ${ch.ends}</p><p class="mt-2">Featured winner: <strong>${ch.featured}</strong></p>`;
  document.getElementById("leaderboard").innerHTML = MOCK_DATA.freelancers.slice(0, 5).map((f, i) => `
    <li><span class="rank">#${i+1}</span><div class="avatar">${f.avatar}</div><div><strong>${f.name}</strong><p class="text-sm text-muted">${f.title}</p></div></li>`).join("");
}

function submitEntry(challengeId) {
  const state = TalentStageStore.get();
  const challenge = (state.challenges || []).find(c => c.id === challengeId);
  if (challenge) {
      challenge.entries += 1;
      TalentStageStore.save(state);
      renderChallenge();
      showToast("Submission uploaded (sandbox)!");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  renderChallenge();
});
</script>
{% endblock %}
