{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="glass-card auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your TalentStage account</p>
    <form class="auth-form">
      <div class="form-group"><label>Email</label><input type="email" required placeholder="you@example.com"></div>
      <div class="form-group"><label>Password</label><input type="password" required placeholder="••••••••"></div>
      <button type="submit" class="btn btn-primary" style="width:100%">Log In</button>
    </form>
    <p class="auth-footer">Don't have an account? <a href="/signup">Sign up</a></p>
  </div>
</div>
{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
