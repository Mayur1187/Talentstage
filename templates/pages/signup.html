{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="glass-card auth-card">
    <h1>Join TalentStage</h1>
    <p class="subtitle">Choose your role and start building</p>
    <div class="role-picker">
      <button type="button" class="role-option selected" data-role="freelancer">Freelancer</button>
      <button type="button" class="role-option" data-role="client">Client</button>
      <button type="button" class="role-option" data-role="both">Both</button>
    </div>
    <form class="auth-form">
      <div class="form-group"><label>Full name</label><input type="text" required placeholder="Alex Morgan"></div>
      <div class="form-group"><label>Email</label><input type="email" required></div>
      <div class="form-group"><label>Password</label><input type="password" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="/login">Log in</a> · <a href="/verify">Verify identity later</a></p>
  </div>
</div>
{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
