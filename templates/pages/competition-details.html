{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/competitions.css') }}">{% endblock %}
{% block content %}
<section class="section container">
  <div class="challenge-hero glass-card" id="challenge-hero"></div>
  <h2 class="mt-3">Leaderboard</h2>
  <ul class="leaderboard glass-card" id="leaderboard"></ul>
  <button class="btn btn-primary mt-3" onclick="showToast('Submission uploaded (demo)')">Submit Entry</button>
</section>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", () => {
  const ch = MOCK_DATA.challenges.find(c => c.id === {{ challenge_id }}) || MOCK_DATA.challenges[0];
  document.getElementById("challenge-hero").innerHTML = `<h1>${ch.title}</h1><p class="challenge-prize">${ch.prize}</p><p>${ch.entries} entries · ${ch.ends}</p><p class="mt-2">Featured winner: <strong>${ch.featured}</strong></p>`;
  document.getElementById("leaderboard").innerHTML = MOCK_DATA.freelancers.slice(0, 5).map((f, i) => `
    <li><span class="rank">#${i+1}</span><div class="avatar">${f.avatar}</div><div><strong>${f.name}</strong><p class="text-sm text-muted">${f.title}</p></div></li>`).join("");
});
</script>
{% endblock %}
