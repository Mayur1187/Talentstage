<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title or 'TalentStage' }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% include 'partials/navbar.html' %}
  <div class="page-wrapper">
    {% block content %}{% endblock %}
  </div>
  {% include 'partials/footer.html' %}
  {% include 'partials/modals.html' %}
  <script src="{{ url_for('static', filename='js/mock-data.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script src="{{ url_for('static', filename='js/freelancer-state.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ai-client.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ai-mock.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
  <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
