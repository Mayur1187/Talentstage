{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">{% endblock %}
{% block content %}
<div class="dashboard-layout">
  {% include 'partials/sidebar.html' %}
  <main class="dashboard-main">
    <h1>Review Freelancer</h1>
    <p class="text-muted">Rate your experience and leave a public review.</p>
    
    <form id="client-review-form" class="glass-card mt-3" style="max-width:640px">
      <div class="form-group">
        <label>Freelancer Name</label>
        <input type="text" name="freelancer" value="Alex Morgan" disabled>
      </div>
      <div class="form-group">
        <label>Project</label>
        <input type="text" name="project" placeholder="e.g. Landing Page Build" required>
      </div>
      <div class="form-group">
        <label>Rating (1-5)</label>
        <select name="rating" required>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Good</option>
          <option value="3">3 - Average</option>
          <option value="2">2 - Poor</option>
          <option value="1">1 - Terrible</option>
        </select>
      </div>
      <div class="form-group">
        <label>Review</label>
        <textarea name="text" rows="4" placeholder="Share your experience working with this freelancer..." required></textarea>
      </div>
      <button class="btn btn-primary" type="submit">Submit Review</button>
    </form>
  </main>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script>
document.getElementById("client-review-form").addEventListener("submit", event => {
  event.preventDefault();
  const form = event.currentTarget;
  const state = TalentStageStore.get();
  
  state.reviews.unshift({
    client: state.currentUser.name,
    project: form.project.value.trim(),
    rating: Number(form.rating.value),
    text: form.text.value.trim(),
    date: new Date().toISOString().slice(0, 10),
  });
  
  TalentStageStore.save(state);
  showToast("Review submitted successfully!");
  setTimeout(() => {
    window.location.href = "/client/dashboard";
  }, 1500);
});
</script>
{% endblock %}
